appId: io.github.nhilaire.lotoquine
name: End the game, then Home has nothing to resume (AC-18)
tags:
  - e2e
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 20000
- openLink: "lotoquine://seed/42"
- tapOn:
    id: "consent-refuse"
- tapOn:
    id: "home-new-game"
- assertVisible: "Touche la boule pour commencer"
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°1"
    timeout: 5000
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°2"
    timeout: 5000
- tapOn:
    id: "game-end"
- assertVisible: "Terminer la partie ?"
- tapOn:
    id: "confirm-yes"
- assertVisible: "Partie arrêtée"
- assertVisible: "2 boules tirées"
- takeScreenshot: 50-stopped
- tapOn:
    id: "over-home"
- assertVisible:
    id: "home-screen"
- assertNotVisible: "Reprendre la partie"
