appId: io.github.nhilaire.lotoquine
name: Draw all 90 balls, drawing disabled, a card can still be checked (AC-37)
tags:
  - e2e
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 20000
- openLink: "lotoquine://seed/42/drawn/88"
- tapOn:
    id: "consent-refuse"
- tapOn:
    id: "home-new-game"
- assertVisible: "Boule n°88"
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°89"
    timeout: 5000
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°90"
    timeout: 5000
- assertVisible: "Toutes les boules sont sorties"
- assertVisible: "Boule n°90"
- assertVisible:
    id: "game-draw"
    enabled: false
- takeScreenshot: 90-all-balls
- tapOn:
    id: "game-check"
- assertVisible:
    id: "check-screen"
