appId: io.github.nhilaire.lotoquine
name: About screen tells the story, the word from the author and the version (AC-41)
tags:
  - e2e
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 20000
- tapOn:
    id: "consent-refuse"
- tapOn:
    id: "home-about"
- assertVisible:
    id: "about-screen"
- assertVisible: "L'histoire de ce jeu"
- assertVisible: ".*loto de l.école.*"
- assertVisible: "Un mot de l'auteur"
- takeScreenshot: 85-about
- scrollUntilVisible:
    element: "Version 0.1.1"
    timeout: 20000
- assertVisible: "Version 0.1.1"
- takeScreenshot: 86-about-end
- tapOn:
    id: "about-back"
- assertVisible:
    id: "home-screen"
