appId: io.github.nhilaire.lotoquine
name: Smoke - consent in French, refuse, no consent screen after a restart (AC-01, AC-02)
tags:
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 20000
- assertVisible: "Statistiques anonymes"
- assertVisible: "Accepter"
- assertVisible: "Refuser"
- takeScreenshot: 01-consent
- tapOn:
    id: "consent-refuse"
- assertVisible:
    id: "home-screen"
- assertVisible: "Nouvelle partie"
- takeScreenshot: 02-home
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000
- assertNotVisible:
    id: "consent-screen"
