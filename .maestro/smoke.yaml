appId: io.github.nhilaire.lotoquine
name: Smoke - consent in the phone language (French or English), refuse, no consent screen after a restart (AC-01, AC-02)
tags:
  - smoke
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 20000
- assertVisible: "Statistiques anonymes|Anonymous statistics"
- assertVisible: "Accepter|Accept"
- assertVisible: "Refuser|Decline"
- takeScreenshot: 01-consent
- tapOn:
    id: "consent-refuse"
- runFlow: helpers/french.yaml
- assertVisible:
    id: "home-screen"
- assertVisible: "Nouvelle partie"
- takeScreenshot: 02-home
- takeScreenshot: readme-1-home
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 20000
- assertNotVisible:
    id: "consent-screen"
