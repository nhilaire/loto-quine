appId: io.github.nhilaire.lotoquine
name: A row with an undrawn number is not yet a win (AC-16)
tags:
  - e2e
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 20000
- openLink: "lotoquine://seed/42"
- tapOn:
    id: "consent-refuse"
- runFlow: helpers/french.yaml
- tapOn:
    id: "home-new-game"
- assertVisible: "Touche la boule pour commencer"
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°1"
    timeout: 5000
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°2"
    timeout: 5000
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°3"
    timeout: 5000
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°4"
    timeout: 5000
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°5"
    timeout: 5000
- tapOn:
    id: "game-check"
- tapOn:
    id: "key-5"
- tapOn:
    id: "key-5"
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-7"
- tapOn:
    id: "key-8"
- tapOn:
    id: "key-6"
- tapOn:
    id: "key-1"
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-7"
- tapOn:
    id: "check-verify"
- assertVisible: "Pas encore…"
- assertVisible: "Il manque 1 numéro"
- takeScreenshot: 30-check-not-yet
- tapOn:
    id: "check-back"
- assertVisible: "Boule n°5"
- assertVisible:
    id: "game-stage"
    text: "Quine"
