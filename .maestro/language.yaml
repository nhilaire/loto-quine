appId: io.github.nhilaire.lotoquine
name: Language - switch from the settings, the whole UI follows at once and the choice survives a restart (AC-43)
tags:
  - e2e
  - language
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 20000
- openLink: "lotoquine://seed/42"
- tapOn:
    id: "consent-refuse"
- tapOn:
    id: "home-settings"
- scrollUntilVisible:
    element:
      id: "settings-language-fr"
- tapOn:
    id: "settings-language-fr"
- assertVisible: "Paramètres"
- assertVisible: "Voix"
- takeScreenshot: language-fr-settings
- tapOn:
    id: "settings-language-en"
- assertVisible: "Settings"
- assertVisible: "Voice"
- assertVisible: "Bingo calls"
- takeScreenshot: language-en-settings
- tapOn:
    id: "settings-back"
- assertVisible: "New game"
- tapOn:
    id: "home-new-game"
- assertVisible:
    id: "game-stage"
    text: "One line"
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Ball no. 1"
    timeout: 5000
- takeScreenshot: language-en-game
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "game-screen"
    timeout: 20000
- assertVisible:
    id: "game-stage"
    text: "One line"
- tapOn:
    id: "game-home"
- tapOn:
    id: "home-settings"
- scrollUntilVisible:
    element:
      id: "settings-language-auto"
- tapOn:
    id: "settings-language-auto"
- scrollUntilVisible:
    element:
      id: "settings-language-fr"
- tapOn:
    id: "settings-language-fr"
- tapOn:
    id: "settings-back"
- assertVisible: "Reprendre la partie"
