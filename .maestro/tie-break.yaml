appId: io.github.nhilaire.lotoquine
name: Tie-break between two winners, then validate (AC-39)
tags:
  - e2e
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 20000
- openLink: "lotoquine://seed/42"
- tapOn:
    id: "consent-refuse"
- runFlow: helpers/french.yaml
- tapOn:
    id: "home-new-game"
- assertVisible: "Touche la boule pour commencer"
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°1"
    timeout: 5000
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°2"
    timeout: 5000
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°3"
    timeout: 5000
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°4"
    timeout: 5000
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°5"
    timeout: 5000
- tapOn:
    id: "game-check"
- assertVisible:
    id: "check-title"
    text: "Vérifier une quine"
- assertVisible: "Saisis seulement la ligne gagnante."
- tapOn:
    id: "key-5"
- tapOn:
    id: "key-5"
- tapOn:
    id: "key-4"
- tapOn:
    id: "key-0"
- tapOn:
    id: "key-7"
- tapOn:
    id: "key-8"
- tapOn:
    id: "key-6"
- tapOn:
    id: "key-1"
- tapOn:
    id: "key-1"
- tapOn:
    id: "key-6"
- tapOn:
    id: "check-verify"
- assertVisible: "Gagné !"
- tapOn:
    id: "check-tie"
- assertVisible:
    id: "tie-count"
    text: "2"
- tapOn:
    id: "tie-draw-1"
- tapOn:
    id: "tie-draw-2"
- assertVisible:
    id: "tie-winner"
    text: "Le joueur [12] gagne avec le [0-9]+ !"
- takeScreenshot: 95-tie-break
- tapOn:
    id: "tie-validate"
- assertVisible: "Continuer le tirage"
