appId: io.github.nhilaire.lotoquine
name: Draw three balls, then resume after the app is killed (AC-13, AC-14)
tags:
  - e2e
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "consent-screen"
    timeout: 20000
- openLink: "lotoquine://seed/42"
- tapOn:
    id: "consent-refuse"
- tapOn:
    id: "home-new-game"
- assertVisible: "Touche la boule pour commencer"
- takeScreenshot: 10-game-start
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°1"
    timeout: 5000
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°2"
    timeout: 5000
- tapOn:
    id: "game-draw"
- extendedWaitUntil:
    visible: "Boule n°3"
    timeout: 5000
- assertVisible:
    id: "game-stage"
    text: "Quine"
- assertVisible: "Boule 78"
- assertVisible:
    id: "board-cell-55"
    selected: true
- assertVisible:
    id: "board-cell-40"
    selected: true
- assertVisible:
    id: "board-cell-78"
    selected: true
- assertVisible:
    id: "board-cell-61"
    selected: false
- takeScreenshot: 11-three-balls
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "game-screen"
    timeout: 20000
- assertVisible: "Boule n°3"
- assertVisible: "Boule 78"
- assertVisible:
    id: "board-cell-78"
    selected: true
- takeScreenshot: 12-resumed
